persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Listener interno apenas para comunicacao container-to-container na proxy-network (nao exposto no host)
listener 1883
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl_file

# Listener externo MQTTS (TLS 1.2+) para Gateways ESP32 em campo (IEC 62443)
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl_file
